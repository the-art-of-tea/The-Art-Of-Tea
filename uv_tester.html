<!DOCTYPE html>
<html lang="en">
<head>
 <meta charset="UTF-8" />
 <meta name="viewport" content="width=device-width, initial-scale=1.0" />
 <meta http-equiv="X-UA-Compatible" content="ie=edge" />
 <title>Universal Viewer</title>
 <link
   rel="stylesheet"
   href="https://cdn.jsdelivr.net/npm/universalviewer@4.0.0/dist/uv.css"/>
 <script
   type="application/javascript"
   src="https://cdn.jsdelivr.net/npm/universalviewer@4.0.0/dist/umd/UV.js"></script>
 <style>
   #uv {
     width: 100%;
     height: 800px;
   }
 </style>
</head>
<body>
 <div class="uv" id="uv"></div>

 <script>
   const data = {
     manifest: "https://shiho1000.github.io/SDL_project/manifests/the_little_tea_book_manifest.json",
     embedded: true // needed for codesandbox frame
   };

   uv = UV.init("uv", data);
 </script>
</body>
</html>
